name: Docker Hub Yukleyici

on: [push]

jobs:
  yukleme-isi:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v3

      - name: Docker Hub'a Giris Yap (Login)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Imaj Olustur (Build)
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ilk-otomasyon:latest .

      - name: Magazaya Yukle (Push)
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ilk-otomasyon:latest
