version: '3.1'

services:
  # 1. Enstrüman: Veritabanı
  veritabani:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: cokgizlisifre
      MYSQL_DATABASE: wordpress
    volumes:
      - db_data:/var/lib/mysql

  # 2. Enstrüman: WordPress Sitesi
  websitesi:
    image: wordpress:latest
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: veritabani
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: cokgizlisifre
    depends_on:
      - veritabani

volumes:
  db_data:
